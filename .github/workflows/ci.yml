name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-release
          - os: ubuntu-24.04
            preset: linux-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: lukka/get-cmake@latest

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version developers use locally (LLVM 23.1.2): releases
      # format some constructs differently, which the runner's own
      # clang-format (18) disagreed with.
      - name: Install clang-format
        run: pipx install clang-format==23.1.2
      - name: clang-format
        run: find src tests prototypes -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
