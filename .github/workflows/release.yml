# Release (spec 9): on a version tag (v0.1.0, ...), builds and tests the
# Windows release, packages it and publishes a GitHub release with
#   Leinwand-<version>-windows-x64.zip(.sha256)  for the web installer
#   LeinwandSetup.exe                            the web installer
# The tag must match the version in CMakeLists.txt.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the project version
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          if ($content -notmatch 'project\(Leinwand VERSION ([0-9.]+)') { throw 'No version' }
          if ("v$($Matches[1])" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match version $($Matches[1])"
          }

      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-2022-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-2022-

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Build and test
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release
          ctest --preset windows-release

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./tools/package-windows.ps1 -Out dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Leinwand ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/Leinwand-*-windows-x64.zip
            dist/Leinwand-*-windows-x64.zip.sha256
            dist/LeinwandSetup.exe
          body: |
            Windows: download and run **LeinwandSetup.exe**. It downloads this version (or one you choose), checks its SHA-256 and installs it.

            - Needs a graphics driver with Vulkan.
            - The installer is not code-signed yet, so Windows SmartScreen warns about it: choose "More info", then "Run anyway".

            Leinwand is not affiliated with or endorsed by Adobe. Adobe, Illustrator and Spectrum are trademarks of Adobe Inc.
