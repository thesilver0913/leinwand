<!-- Phase 1 SVG import features in one file (hand-written test data). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="200" height="150" viewBox="0 0 400 300">
  <defs>
    <style>
      .warm { fill: #e34850; stroke: #2c2c2c; stroke-width: 4; }
      g.pale rect { fill-opacity: 0.5; }
      #star { fill: gold; }
    </style>
    <linearGradient id="sky" x1="0" x2="1">
      <stop offset="0" stop-color="#1e90ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="330" cy="70" r="40"/>
    </clipPath>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Background">
    <rect width="400" height="300" fill="url(#sky)"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Art">
    <rect class="warm" x="20" y="20" width="120" height="80" rx="12"/>
    <g class="pale" transform="translate(160 20) rotate(15)">
      <rect width="80" height="60" fill="#4069fd"/>
      <circle cx="40" cy="30" r="20" fill="none" stroke="white" stroke-width="3" stroke-dasharray="6 4"/>
    </g>
    <path id="star" d="M330 30 L340 60 L370 60 L345 78 L355 108 L330 90 L305 108 L315 78 L290 60 L320 60 Z"
          clip-path="url(#round)" stroke="black"/>
    <path d="M20 160 a60 60 0 0 1 120 0 q60 80 120 0 t120 0" fill="none" stroke="#2d9d78"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="40,280 100,200 160,280" fill="#ff8c00" fill-rule="evenodd" opacity="0.8"/>
    <ellipse cx="300" cy="240" rx="70" ry="35" style="fill:#9b59b6;stroke:none"/>
    <line x1="200" y1="290" x2="390" y2="200" stroke="currentColor" color="#111" stroke-width="2"/>
    <text x="200" y="40" font-size="16" class="warm">Hello</text>
  </g>
</svg>
