</defs>
<rect x="22" y="22" width="980" height="980" rx="221" fill="#121216"/>
<g clip-path="url(#clip)">
<g transform="translate(1002 22) scale(1.5) translate(-1002 -22)">
<g fill="none" stroke-width="110" stroke-linecap="round">
<path d="M 300 -60 C 480 260, 700 200, 1090 560" stroke="#8B4DFF"/>
<path d="M 420 -60 C 580 200, 780 150, 1090 430" stroke="#2F6BFF"/>
